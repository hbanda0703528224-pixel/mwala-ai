<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mwala AI - Music Video Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
  <h1>🔥 Mwala AI</h1>
  <p class="subtitle">AI Music Video Generator from Malawi</p>
  
  <textarea id="songInput" placeholder="Enter your song lyrics or idea... e.g., Amapiano love song in the rain"></textarea>
  
  <label>Select Style</label>
  <select id="styleSelect">
    <option value="afro-animation">Afro Animation</option>
    <option value="amapiano-vibe">Amapiano Vibe</option>
    <option value="village-scene">Chichewa Village</option>
    <option value="neon-city">Neon City Night</option>
  </select>
  
  <button onclick="generateVideo()">Generate Video ✨</button>
  
  <div id="resultArea"></div>
  <p class="footer">Powered by Mwala AI - Built on GitHub</p>
</div>
<script src="script.js"></script>
</body>
</html>
